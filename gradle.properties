# Dev runs only: Guard Villagers 2.4.12 (NeoForge 1.21.1), the owner's pack's, to see a guard rise in her storm with its gear.
guardvillagers_version=JyXugpy2
# Dev runs only: Dummmmmmy 1.21-2.1.2 and Moonlight 1.21.1-3.8.3 (NeoForge), the owner's pack's, for damage and healing numbers.
