parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# The Living World 1.3.6c runs 21.1.265.
neo_version=21.1.265
# The oldest NeoForge the jar accepts: Ice and Fire CE's own floor (0.60.0; checked by building and running the
# smoke test on it, with JEI left out of the run: JEI wants 21.1.238). neo_version above is the pack's, which the
# dev runs use.
neo_version_range=[21.1.230,)
loader_version_range=[4,)

# Ice and Fire CE and the libraries it requires, pinned to the files The Living World ships. These
# are Modrinth version ids, not version numbers: a number can name several files (Uranus 2.4.1 is
# both a NeoForge and a Fabric build), an id names exactly one.
# Ice and Fire CE 2.1-beta.1
iceandfire_version=o6K8vx54
iceandfire_version_range=[2.1-beta.1,)
# Uranus 2.4.1 (NeoForge)
uranus_version=1YdU56pR
# Jupiter 2.3.7
jupiter_version=Jpcw76rq
# GeckoLib 4.9.3 (NeoForge)
geckolib_version=Grwn5rUB

# Iron's Spells 'n Spellbooks (her loot: inks and scrolls; later her spells) and the libraries it
# requires, pinned the same way.
# Iron's Spells 'n Spellbooks 1.21.1-3.16.3
irons_spellbooks_version=slKLosTb
irons_spellbooks_version_range=[1.21.1-3.0.0,)
# Iron's Lib 1.21.1-2.3.0
irons_lib_version=dgH7P81J
# playerAnimator 2.0.4+1.21.1
playeranimator_version=HJZB6bmA
# Curios API 9.5.1+1.21.1
